name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The contract tests check WHOOP's live OpenAPI spec, so run weekly to catch
    # an API change before someone hits it as a screen full of nulls.
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
